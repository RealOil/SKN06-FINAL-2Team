<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기본 레이아웃</title></head>
<body>
    <header>
        <nav>
            <div class="navbar">
                <!-- 로고나 왼쪽 메뉴 -->
                <div class="user-info">
                    {% if user.is_authenticated %}
                        <span>{{ user.username }}님</span>
                        <a href="{% url 'account:user_information' %}">회원 정보</a>
                        <a href="{% url 'account:logout' %}" class="nav-link">로그아웃</a>
                        
                    {% else %}
                        <a href="{% url 'account:login' %}">로그인</a>
                        
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- 이 부분에 각 페이지별 콘텐츠가 들어갑니다 -->
        {% endblock %}
    </main>

    <footer>
        <!-- 하단 푸터 내용 -->
        <p>&copy; 2025 Company</p>
    </footer>
</body>
</html>
