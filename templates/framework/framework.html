<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기본 레이아웃</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}"> <!-- CSS 파일 경로 -->
</head>
<body>
    <header>
        <nav>
            <div class="navbar">
                <!-- 로고나 왼쪽 메뉴 -->
                <a href="{% url 'chatbot:home' %}">홈</a>
                
                <div class="user-info">
                    {% if user.is_authenticated %}
                        <!-- 로그인한 상태 -->
                        <span>{{ user.username }}님</span>
                        <a href="{% url 'account:user_information' %}">회원 정보</a>
                        <a href="{% url 'account:user_logout' %}">로그아웃</a>
                    {% else %}
                        <!-- 로그인하지 않은 상태 -->
                        <a href="{% url 'account:user_login' %}">로그인</a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- 이 부분에 각 페이지별 콘텐츠가 들어갑니다 -->
        {% endblock %}
    </main>

    <footer>
        <!-- 하단 푸터 내용 -->
        <p>&copy; 2025 Company</p>
    </footer>
</body>
</html>
